<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vivero Raíz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Vivero Raíz</h1>
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Abrir menú">&#9776;</button>
    <nav class="nav" id="menu">
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <span id="zonaUsuario"><a href="login.html" class="boton">Ingresar</a></span>
    </nav>
  </header>

  <main>
    <section class="login">
      <h2>Iniciar Sesión</h2>
      <form id="formLogin" novalidate>
        <div id="errores" class="mensaje-error"></div>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" placeholder="admin@vivero.com">

        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" name="clave">

        <label for="recordar">
          <input type="checkbox" id="recordar" name="recordar">
          Mantener la sesión iniciada
        </label>

        <button type="submit">Ingresar</button>
        <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Vivero Raíz &copy; 2026</p>
  </footer>

  <script src="js/sesion.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Vivero Raíz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Vivero Raíz</h1>
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Abrir menú">&#9776;</button>
    <nav class="nav" id="menu">
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <span id="zonaUsuario"><a href="login.html" class="boton">Ingresar</a></span>
    </nav>
  </header>

  <main>
    <section class="catalogo">
      <h2>Nuestro Catálogo</h2>
      <div class="filtros">
        <div>
          <label for="buscador">Buscar por nombre</label>
          <input type="text" id="buscador" placeholder="Ej: cactus">
        </div>
        <div>
          <label for="filtroCategoria">Categoría</label>
          <select id="filtroCategoria">
            <option value="">Todas</option>
            <option value="interior">Interior</option>
            <option value="exterior">Exterior</option>
            <option value="suculenta">Suculenta</option>
            <option value="aromática">Aromática</option>
          </select>
        </div>
        <div>
          <label for="ordenar">Ordenar por</label>
          <select id="ordenar">
            <option value="">Sin orden</option>
            <option value="precio-menor">Precio: menor a mayor</option>
            <option value="precio-mayor">Precio: mayor a menor</option>
            <option value="nombre">Nombre (A-Z)</option>
          </select>
        </div>
        <button type="button" class="boton" id="limpiar">Limpiar filtros</button>
      </div>

      <p id="estado"></p>
      <p id="contador"></p>
      <p id="sinResultados" class="mensaje-error">No encontramos plantas con ese criterio.</p>

      <div class="tarjetas" id="listaPlantas"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Vivero Raíz &copy; 2026</p>
  </footer>

  <script src="js/sesion.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>

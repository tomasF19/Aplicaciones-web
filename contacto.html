<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Vivero Raíz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Vivero Raíz</h1>
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Abrir menú">&#9776;</button>
    <nav class="nav" id="menu">
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <span id="zonaUsuario"><a href="login.html" class="boton">Ingresar</a></span>
    </nav>
  </header>

  <main>
    <section class="contacto">
      <h2>Contáctanos</h2>
      <form id="formContacto" novalidate>
        <div id="errores" class="mensaje-error"></div>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo">

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono">

        <label for="motivo">Motivo de consulta:</label>
        <select id="motivo" name="motivo">
          <option value="general">Consulta general</option>
          <option value="compra">Compra</option>
          <option value="reclamo">Reclamo</option>
        </select>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="5"></textarea>

        <label for="novedades">
          <input type="checkbox" id="novedades" name="novedades">
          Quiero recibir novedades por correo
        </label>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Vivero Raíz &copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/sesion.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
